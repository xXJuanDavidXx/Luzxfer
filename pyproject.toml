[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luzxfer"
version = "0.10.0"
description = "Intercepting proxy and web pentesting workbench for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Juan David Jaramillo" }]
keywords = ["security", "pentesting", "proxy", "http", "tui", "wstg", "appsec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# Deliberadamente minimo. Todo lo demas es stdlib, porque este proyecto
# tiene que instalarse en Termux, donde no hay wheels precompilados y
# cualquier extension en C o Rust se compila en el telefono.
dependencies = [
    "textual>=0.80",
]

[project.optional-dependencies]
# El motor mitmproxy es opcional: da TLS, HTTP/2 y WebSockets, pero arrastra
# cryptography (Rust). En PC se instala sin problema; en Termux no.
mitm = ["mitmproxy>=10.0"]
# Brotli. Sin esto, el motor le quita "br" al Accept-Encoding para que
# el servidor no lo use; con esto ademas se pueden leer los cuerpos que
# lleguen comprimidos asi de todas formas. Compila, no va en Termux.
br = ["brotli>=1.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "textual-dev>=1.5",
    "ruff>=0.6",
]

[project.scripts]
luzxfer = "luzxfer.__main__:main"

[project.urls]
Homepage = "https://github.com/xXJuanDavidXx/Luzxfer"
Issues = "https://github.com/xXJuanDavidXx/Luzxfer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/luzxfer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
